name: Update Live Scores & Simulate

on:
  schedule:
    # 比赛期间每30分钟 (6月11日-7月19日)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live scores & odds
        run: python scripts/fetch_scores.py

      - name: Monte Carlo simulation
        run: python scripts/simulate_outcomes.py

      - name: Copy to public
        run: |
          cp src/data/live_scores.json public/live_scores.json
          cp src/data/standings.json public/standings.json 2>/dev/null || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live_scores.json public/standings.json src/data/live_scores.json src/data/standings.json src/data/predictions.ts
          git diff --cached --quiet || git commit -m "live: update scores & simulate $(date -u '+%Y-%m-%d %H:%M')"
          git push
