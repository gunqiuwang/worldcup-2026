name: Update Live Scores & Simulate

on:
  schedule:
    # 比赛期间每30分钟 (6月11日-7月19日)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest
    concurrency:
      group: update-scores
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check if tournament is active
        id: check
        run: |
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          if [[ "$MONTH" == "06" && "$DAY" -ge "11" ]] || [[ "$MONTH" == "07" && "$DAY" -le "19" ]]; then
            echo "active=true" >> $GITHUB_OUTPUT
          else
            echo "active=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch live scores & odds
        if: steps.check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_scores.py

      - name: Monte Carlo simulation
        if: steps.check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/simulate_outcomes.py

      - name: Generate match previews
        if: steps.check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/match_preview.py

      - name: Copy to public
        if: steps.check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cp src/data/live_scores.json public/live_scores.json 2>/dev/null || true
          cp src/data/standings.json public/standings.json 2>/dev/null || true
          cp src/data/match-previews.json public/match-previews.json 2>/dev/null || true

      - name: Commit and push
        if: steps.check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the files we care about
          git add src/data/live_scores.json src/data/predictions.ts src/data/schedule.ts
          git add public/live_scores.json public/standings.json public/match-previews.json

          # Check if there's anything to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          echo "Staged changes:"
          git diff --cached --stat

          git commit -m "live: update scores & simulate $(date -u '+%Y-%m-%d %H:%M')"

          # Pull with rebase, then push
          git pull --rebase -X theirs origin master
          git push origin master
