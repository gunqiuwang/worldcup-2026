<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026 世界杯 — 概率分析</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0F1A;--bg2:#111827;--bg3:#1a2035;
  --green:#00E676;--red:#FF5252;--gold:#FFD54F;
  --text:#E8EAED;--text2:#9AA0A6;--text3:#5F6368;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 50% 0%,rgba(0,230,118,0.03) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(255,82,82,0.02) 0%,transparent 40%);pointer-events:none;z-index:0}

#app{position:relative;z-index:1;min-height:100vh;padding-bottom:72px;max-width:480px;margin:0 auto}
@media(min-width:768px){#app{max-width:520px}}
@media(min-width:1024px){#app{max-width:560px}}

.page{display:none;padding:0 16px;animation:fadeUp .4s ease both}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Header */
.header{padding:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.25rem;font-weight:800;background:linear-gradient(135deg,var(--gold),#FFA726);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--green);font-weight:600}
.live-dot::before{content:'';width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite;box-shadow:0 0 8px var(--green)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* Countdown */
.countdown{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:20px 16px;margin:8px 0 16px;text-align:center;backdrop-filter:blur(20px)}
.countdown-label{font-size:.75rem;color:var(--text2);margin-bottom:10px;letter-spacing:1px;text-transform:uppercase}
.countdown-timer{display:flex;justify-content:center;gap:8px}
.countdown-unit{display:flex;flex-direction:column;align-items:center;min-width:56px}
.countdown-num{font-size:1.75rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.countdown-lbl{font-size:.6rem;color:var(--text3);margin-top:4px;letter-spacing:.5px}
.countdown-sep{font-size:1.5rem;color:var(--text3);align-self:flex-start;margin-top:2px;font-weight:300}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--glass);border-radius:12px;padding:4px;margin-bottom:16px;border:1px solid var(--glass-border)}
.tab{flex:1;text-align:center;padding:10px 0;font-size:.8rem;font-weight:600;color:var(--text3);border-radius:9px;cursor:pointer;transition:all .25s ease;user-select:none}
.tab.active{background:rgba(255,213,79,0.12);color:var(--gold)}

/* Match Cards */
.match-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:16px;margin-bottom:12px;transition:all .2s ease;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.match-card:active{transform:scale(.97)}
.match-card .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.match-card .time{font-size:.7rem;color:var(--text2);font-weight:500}
.match-card .venue{font-size:.65rem;color:var(--text3)}
.match-card .badges{display:flex;gap:6px}
.badge{font-size:.6rem;padding:3px 8px;border-radius:20px;font-weight:600}
.badge-live{background:rgba(255,82,82,0.2);color:var(--red);animation:pulse 1.2s infinite}
.badge-finished{background:rgba(0,230,118,0.15);color:var(--green)}
.badge-scheduled{background:rgba(255,213,79,0.1);color:var(--text2)}
.badge-group{background:rgba(255,255,255,0.06);color:var(--text2)}
.match-card .teams{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.team-side{text-align:center;flex:1}
.team-flag{font-size:2.2rem;line-height:1;margin-bottom:4px}
.team-name{font-size:.78rem;font-weight:600;color:var(--text)}
.team-score{font-size:1.5rem;font-weight:800;color:var(--gold);margin-top:2px}
.vs-center{width:80px;flex-shrink:0;text-align:center}
.vs-center .vs-text{font-size:.65rem;color:var(--text3);font-weight:700;margin-bottom:6px}

/* Probability Bar */
.prob-bar-wrap{margin:8px 0}
.prob-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden;display:flex}
.prob-bar-fill{height:100%;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.prob-bar-fill.home{background:linear-gradient(90deg,var(--green),#00C853)}
.prob-bar-fill.draw{background:linear-gradient(90deg,var(--gold),#FFA726)}
.prob-bar-fill.away{background:linear-gradient(90deg,var(--red),#D32F2F)}
.prob-labels{display:flex;justify-content:space-between;font-size:.6rem;color:var(--text3);margin-top:4px}
.prob-labels .val{color:var(--text2);font-weight:600}

/* Group Standings */
.group-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(12px)}
.group-title{font-size:.85rem;font-weight:700;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.group-title span{font-size:.65rem;color:var(--text3);font-weight:400}
.standings-table{width:100%;border-collapse:collapse;font-size:.7rem}
.standings-table th{text-align:left;color:var(--text3);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--glass-border);font-size:.6rem;text-transform:uppercase;letter-spacing:.5px}
.standings-table td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.02)}
.standings-table tr:last-child td{border-bottom:none}
.standings-table .team-cell{display:flex;align-items:center;gap:6px;font-weight:600}
.standings-table .pos{width:18px;text-align:center;font-weight:700;color:var(--text3)}
.standings-table .pos.qualify{color:var(--green)}
.standings-table .flag{font-size:1rem}
.standings-table .pts{font-weight:800;color:var(--gold)}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:8px;color:var(--text3);font-size:.8rem}
.spinner{width:20px;height:20px;border:2px solid var(--glass-border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.error-msg{text-align:center;padding:40px 20px;color:var(--red);font-size:.8rem}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(11,15,26,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);display:flex;z-index:100;padding:8px 0 env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--text3);font-size:.6rem;font-weight:500;cursor:pointer;transition:color .2s}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:22px;height:22px}

/* Refresh hint */
.refresh-hint{text-align:center;font-size:.6rem;color:var(--text3);padding:8px 0 16px}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header" style="padding:16px">
    <h1>⚽ 2026 世界杯</h1>
    <div class="live-dot" id="liveStatus">数据加载中</div>
  </div>

  <!-- Countdown -->
  <div class="countdown" id="countdown">
    <div class="countdown-label">距开赛</div>
    <div class="countdown-timer" id="countdownTimer">
      <div class="countdown-unit"><div class="countdown-num" id="cdDays">--</div><div class="countdown-lbl">天</div></div>
      <div class="countdown-sep">:</div>
      <div class="countdown-unit"><div class="countdown-num" id="cdHours">--</div><div class="countdown-lbl">时</div></div>
      <div class="countdown-sep">:</div>
      <div class="countdown-unit"><div class="countdown-num" id="cdMins">--</div><div class="countdown-lbl">分</div></div>
      <div class="countdown-sep">:</div>
      <div class="countdown-unit"><div class="countdown-num" id="cdSecs">--</div><div class="countdown-lbl">秒</div></div>
    </div>
  </div>

  <!-- Page: Matches -->
  <div class="page active" id="pageMatches">
    <div class="tabs">
      <div class="tab active" data-tab="today">今日</div>
      <div class="tab" data-tab="schedule">全部赛程</div>
    </div>
    <div id="matchesContent">
      <div class="loading"><div class="spinner"></div>加载比赛数据...</div>
    </div>
  </div>

  <!-- Page: Standings -->
  <div class="page" id="pageStandings">
    <div id="standingsContent">
      <div class="loading"><div class="spinner"></div>加载积分榜...</div>
    </div>
  </div>

  <!-- Page: Odds -->
  <div class="page" id="pageOdds">
    <div style="text-align:center;padding:60px 20px;color:var(--text3)">
      <div style="font-size:2rem;margin-bottom:12px">📊</div>
      <div style="font-size:.85rem;font-weight:600;margin-bottom:8px">赔率分析</div>
      <div style="font-size:.7rem">开赛后开放（6月11日）</div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" data-page="pageMatches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      赛程
    </div>
    <div class="nav-item" data-page="pageStandings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8m-4-4v4m-6-8l3-8h6l3 8"/><rect x="4" y="9" width="16" height="4" rx="1"/></svg>
      积分榜
    </div>
    <div class="nav-item" data-page="pageOdds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      赔率
    </div>
  </div>
</div>

<script>
// === 配置 ===
const API_BASE = 'https://worldcup-api.404969.workers.dev'; // Worker 地址
const WC_START = new Date('2026-06-11T19:00:00Z'); // 开幕战时间 (UTC)

// 本地数据（离线降级）
const TEAMS = {"ARG": {"cn": "阿根廷", "flag": "🇦🇷", "fifa_rank": 1}, "ALG": {"cn": "阿尔及利亚", "flag": "🇩🇿", "fifa_rank": 37}, "AUT": {"cn": "奥地利", "flag": "🇦🇹", "fifa_rank": 22}, "JOR": {"cn": "约旦", "flag": "🇯🇴", "fifa_rank": 68}, "USA": {"cn": "美国", "flag": "🇺🇸", "fifa_rank": 12}, "PAR": {"cn": "巴拉圭", "flag": "🇵🇾", "fifa_rank": 55}, "AUS": {"cn": "澳大利亚", "flag": "🇦🇺", "fifa_rank": 24}, "TUR": {"cn": "土耳其", "flag": "🇹🇷", "fifa_rank": 26}, "BEL": {"cn": "比利时", "flag": "🇧🇪", "fifa_rank": 8}, "EGY": {"cn": "埃及", "flag": "🇪🇬", "fifa_rank": 32}, "IRN": {"cn": "伊朗", "flag": "🇮🇷", "fifa_rank": 20}, "NZL": {"cn": "新西兰", "flag": "🇳🇿", "fifa_rank": 94}, "CAN": {"cn": "加拿大", "flag": "🇨🇦", "fifa_rank": 43}, "BIH": {"cn": "波黑", "flag": "🇧🇦", "fifa_rank": 63}, "QAT": {"cn": "卡塔尔", "flag": "🇶🇦", "fifa_rank": 40}, "SUI": {"cn": "瑞士", "flag": "🇨🇭", "fifa_rank": 16}, "BRA": {"cn": "巴西", "flag": "🇧🇷", "fifa_rank": 5}, "HAI": {"cn": "海地", "flag": "🇭🇹", "fifa_rank": 87}, "MAR": {"cn": "摩洛哥", "flag": "🇲🇦", "fifa_rank": 13}, "SCO": {"cn": "苏格兰", "flag": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "fifa_rank": 39}, "GER": {"cn": "德国", "flag": "🇩🇪", "fifa_rank": 10}, "CUW": {"cn": "库拉索", "flag": "🇨🇼", "fifa_rank": 85}, "CIV": {"cn": "科特迪瓦", "flag": "🇨🇮", "fifa_rank": 38}, "ECU": {"cn": "厄瓜多尔", "flag": "🇪🇨", "fifa_rank": 30}, "COL": {"cn": "哥伦比亚", "flag": "🇨🇴", "fifa_rank": 14}, "POR": {"cn": "葡萄牙", "flag": "🇵🇹", "fifa_rank": 7}, "COD": {"cn": "刚果(金)", "flag": "🇨🇩", "fifa_rank": 58}, "UZB": {"cn": "乌兹别克斯坦", "flag": "🇺🇿", "fifa_rank": 61}, "ESP": {"cn": "西班牙", "flag": "🇪🇸", "fifa_rank": 3}, "CPV": {"cn": "佛得角", "flag": "🇨🇻", "fifa_rank": 72}, "KSA": {"cn": "沙特", "flag": "🇸🇦", "fifa_rank": 56}, "URU": {"cn": "乌拉圭", "flag": "🇺🇾", "fifa_rank": 11}, "ENG": {"cn": "英格兰", "flag": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "fifa_rank": 4}, "CRO": {"cn": "克罗地亚", "flag": "🇭🇷", "fifa_rank": 9}, "GHA": {"cn": "加纳", "flag": "🇬🇭", "fifa_rank": 47}, "PAN": {"cn": "巴拿马", "flag": "🇵🇦", "fifa_rank": 48}, "MEX": {"cn": "墨西哥", "flag": "🇲🇽", "fifa_rank": 15}, "CZE": {"cn": "捷克", "flag": "🇨🇿", "fifa_rank": 36}, "KOR": {"cn": "韩国", "flag": "🇰🇷", "fifa_rank": 23}, "RSA": {"cn": "南非", "flag": "🇿🇦", "fifa_rank": 57}, "FRA": {"cn": "法国", "flag": "🇫🇷", "fifa_rank": 2}, "IRQ": {"cn": "伊拉克", "flag": "🇮🇶", "fifa_rank": 59}, "NOR": {"cn": "挪威", "flag": "🇳🇴", "fifa_rank": 42}, "SEN": {"cn": "塞内加尔", "flag": "🇸🇳", "fifa_rank": 17}, "NED": {"cn": "荷兰", "flag": "🇳🇱", "fifa_rank": 6}, "JPN": {"cn": "日本", "flag": "🇯🇵", "fifa_rank": 18}, "SWE": {"cn": "瑞典", "flag": "🇸🇪", "fifa_rank": 25}, "TUN": {"cn": "突尼斯", "flag": "🇹🇳", "fifa_rank": 35}};
const GROUPS = {"A": ["ARG", "ALG", "AUT", "JOR"], "B": ["USA", "PAR", "AUS", "TUR"], "C": ["BEL", "EGY", "IRN", "NZL"], "D": ["CAN", "BIH", "QAT", "SUI"], "E": ["BRA", "HAI", "MAR", "SCO"], "F": ["GER", "CUW", "CIV", "ECU"], "G": ["COL", "POR", "COD", "UZB"], "H": ["ESP", "CPV", "KSA", "URU"], "I": ["ENG", "CRO", "GHA", "PAN"], "J": ["MEX", "CZE", "KOR", "RSA"], "K": ["FRA", "IRQ", "NOR", "SEN"], "L": ["NED", "JPN", "SWE", "TUN"]};

// === 状态 ===
let allMatches = [];
let standings = {};
let currentTab = 'today';
let isLoading = false;

// === 初始化 ===
document.addEventListener('DOMContentLoaded', () => {
  startCountdown();
  setupNav();
  setupTabs();
  loadData();
  // 每 60 秒刷新
  setInterval(loadData, 60000);
});

// === 倒计时 ===
function startCountdown() {
  function update() {
    const now = new Date();
    const diff = WC_START - now;
    if (diff <= 0) {
      document.querySelector('.countdown-label').textContent = '世界杯进行中';
      document.getElementById('cdDays').textContent = '🔥';
      document.getElementById('cdHours').textContent = '';
      document.getElementById('cdMins').textContent = '';
      document.getElementById('cdSecs').textContent = '';
      document.querySelectorAll('.countdown-sep').forEach(el => el.style.display = 'none');
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('cdDays').textContent = String(d).padStart(2, '0');
    document.getElementById('cdHours').textContent = String(h).padStart(2, '0');
    document.getElementById('cdMins').textContent = String(m).padStart(2, '0');
    document.getElementById('cdSecs').textContent = String(s).padStart(2, '0');
  }
  update();
  setInterval(update, 1000);
}

// === 导航 ===
function setupNav() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(page).classList.add('active');
      item.classList.add('active');
    });
  });
}

function setupTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      renderMatches();
    });
  });
}

// === 数据加载 ===
async function loadData() {
  try {
    // 并行加载
    const [scheduleResp, standingsResp] = await Promise.allSettled([
      fetchJson(`${API_BASE}/api/schedule`),
      fetchJson(`${API_BASE}/api/standings`),
    ]);

    if (scheduleResp.status === 'fulfilled' && scheduleResp.value) {
      allMatches = scheduleResp.value;
    }
    if (standingsResp.status === 'fulfilled' && standingsResp.value) {
      standings = standingsResp.value;
    }

    document.getElementById('liveStatus').textContent = 'LIVE';
    renderMatches();
    renderStandings();
  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('liveStatus').textContent = '离线';
    document.getElementById('matchesContent').innerHTML =
      '<div class="error-msg">数据加载失败，请刷新重试</div>';
  }
}

async function fetchJson(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

// === 渲染比赛 ===
function renderMatches() {
  const container = document.getElementById('matchesContent');
  let matches = allMatches;

  if (currentTab === 'today') {
    const today = new Date().toISOString().slice(0, 10);
    matches = allMatches.filter(m => m.date && m.date.slice(0, 10) === today);
    if (matches.length === 0) {
      // 如果今天没比赛，显示最近的
      const now = new Date();
      const future = allMatches.filter(m => new Date(m.date) > now);
      matches = future.slice(0, 6);
      if (matches.length === 0) {
        matches = allMatches.slice(0, 6);
      }
      container.innerHTML = `<div style="text-align:center;font-size:.7rem;color:var(--text3);padding:8px 0">今日无比赛，显示最近赛事</div>` +
        matches.map(renderMatchCard).join('');
      return;
    }
  }

  if (matches.length === 0) {
    container.innerHTML = '<div class="error-msg">暂无比赛数据</div>';
    return;
  }

  // 按日期分组
  const grouped = {};
  matches.forEach(m => {
    const date = m.date ? m.date.slice(0, 10) : 'unknown';
    if (!grouped[date]) grouped[date] = [];
    grouped[date].push(m);
  });

  let html = '';
  for (const [date, dayMatches] of Object.entries(grouped)) {
    html += `<div style="font-size:.7rem;color:var(--text2);padding:12px 0 8px;font-weight:600">${formatDate(date)}</div>`;
    html += dayMatches.map(renderMatchCard).join('');
  }

  container.innerHTML = html;
}

function renderMatchCard(m) {
  const home = m.home || {};
  const away = m.away || {};
  const status = m.status || 'pre';

  let statusBadge = '';
  if (status === 'in') statusBadge = '<span class="badge badge-live">● 进行中</span>';
  else if (status === 'post') statusBadge = '<span class="badge badge-finished">已结束</span>';
  else statusBadge = '<span class="badge badge-scheduled">未开始</span>';

  const groupBadge = m.group ? `<span class="badge badge-group">组${m.group}</span>` : '';

  let scoreOrVs = '';
  if (status === 'in' || status === 'post') {
    scoreOrVs = `<div style="display:flex;align-items:center;gap:8px">
      <div class="team-score">${home.score ?? 0}</div>
      <div style="color:var(--text3);font-size:.7rem">-</div>
      <div class="team-score">${away.score ?? 0}</div>
    </div>`;
  } else {
    scoreOrVs = `<div class="vs-text">${formatTime(m.date)}</div>`;
  }

  // 概率条
  let probBar = '';
  if (m.odds) {
    const hp = m.odds.home_win_prob || 0;
    const dp = m.odds.draw_prob || 0;
    const ap = m.odds.away_win_prob || 0;
    if (hp + dp + ap > 0) {
      probBar = `
        <div class="prob-bar-wrap">
          <div class="prob-bar">
            <div class="prob-bar-fill home" style="width:${hp}%"></div>
            <div class="prob-bar-fill draw" style="width:${dp}%"></div>
            <div class="prob-bar-fill away" style="width:${ap}%"></div>
          </div>
          <div class="prob-labels">
            <span>${home.name || home.name_en} <span class="val">${hp.toFixed(1)}%</span></span>
            <span>平 <span class="val">${dp.toFixed(1)}%</span></span>
            <span>${away.name || away.name_en} <span class="val">${ap.toFixed(1)}%</span></span>
          </div>
        </div>`;
    }
  }

  return `
    <div class="match-card">
      <div class="meta">
        <div>
          <div class="time">${m.clock || formatTimeShort(m.date)}</div>
          <div class="venue">${m.venue || ''}${m.city ? ' · ' + m.city : ''}</div>
        </div>
        <div class="badges">${groupBadge}${statusBadge}</div>
      </div>
      <div class="teams">
        <div class="team-side">
          <div class="team-flag">${home.flag || '🏳️'}</div>
          <div class="team-name">${home.name || home.name_en || '?'}</div>
        </div>
        <div class="vs-center">${scoreOrVs}</div>
        <div class="team-side">
          <div class="team-flag">${away.flag || '🏳️'}</div>
          <div class="team-name">${away.name || away.name_en || '?'}</div>
        </div>
      </div>
      ${probBar}
    </div>`;
}

// === 渲染积分榜 ===
function renderStandings() {
  const container = document.getElementById('standingsContent');

  // 如果 API 没返回积分榜，用本地小组数据生成空表
  const groups = Object.keys(GROUPS);
  if (groups.length === 0) {
    container.innerHTML = '<div class="error-msg">暂无积分榜数据</div>';
    return;
  }

  let html = '';
  for (const group of groups.sort()) {
    const teams = GROUPS[group] || [];
    const teamData = standings[group] || [];

    html += `
      <div class="group-card">
        <div class="group-title">组${group} <span>(${teams.length} 队)</span></div>
        <table class="standings-table">
          <thead>
            <tr>
              <th>#</th>
              <th>球队</th>
              <th>赛</th>
              <th>胜</th>
              <th>平</th>
              <th>负</th>
              <th>进</th>
              <th>失</th>
              <th>净</th>
              <th>分</th>
            </tr>
          </thead>
          <tbody>`;

    teams.forEach((abbr, i) => {
      const t = TEAMS[abbr] || {};
      const s = teamData.find(x => x.team === abbr)?.stats || {};
      const played = s.gamesPlayed || 0;
      const wins = s.wins || 0;
      const draws = s.ties || 0;
      const losses = s.losses || 0;
      const gf = s.pointsFor || 0;
      const ga = s.pointsAgainst || 0;
      const gd = gf - ga;
      const pts = s.points || (wins * 3 + draws);
      const posClass = i < 2 ? 'pos qualify' : 'pos';

      html += `
            <tr>
              <td class="${posClass}">${i + 1}</td>
              <td><div class="team-cell"><span class="flag">${t.flag || '🏳️'}</span>${t.cn || abbr}</div></td>
              <td>${played}</td>
              <td>${wins}</td>
              <td>${draws}</td>
              <td>${losses}</td>
              <td>${gf}</td>
              <td>${ga}</td>
              <td>${gd > 0 ? '+' + gd : gd}</td>
              <td class="pts">${pts}</td>
            </tr>`;
    });

    html += `
          </tbody>
        </table>
      </div>`;
  }

  container.innerHTML = html;
}

// === 工具函数 ===
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00+08:00');
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  return `${d.getMonth() + 1}月${d.getDate()}日 周${days[d.getDay()]}`;
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' });
}

function formatTimeShort(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' });
}
</script>
